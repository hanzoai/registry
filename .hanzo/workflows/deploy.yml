# Apply k8s/ and roll the registry. This is the lane hanzo.yml already describes
# ("the rollout is deploy.yml's"); it was still sitting in .github/workflows,
# which git.hanzo.ai stops reading the moment .hanzo/workflows exists — so the
# rollout this repo documents had no way to fire here.
#
# Two things were broken beyond the location. The label was ubuntu-latest, which
# no runner in this fleet answers, and an unserved label queues rather than
# fails. And the KMS calls used the retired Infisical surface
# (/api/v1/auth/universal-auth/login + /api/v3/secrets/raw); KMS is luxfi/kms
# now and answers /v1/kms/auth/login + /v1/kms/orgs/<org>/secrets/<path>/<name>.
# Either one alone made the deploy unreachable.
#
# oci.hanzo.ai runs UPSTREAM registry:2 configured entirely through env in
# k8s/deployment.yaml — there is no image of ours to publish here, which is why
# hanzo.yml declares no `images:`. This applies manifests; it does not build.
name: deploy
on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'config.yml'
  workflow_dispatch:

concurrency:
  group: deploy-registry
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Read the DigitalOcean token from KMS
        id: kms
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          KMS_ENDPOINT: ${{ vars.KMS_ENDPOINT || 'https://kms.hanzo.ai' }}
          KMS_ORG: ${{ vars.KMS_ORG || 'hanzo' }}
          KMS_SECRET_ENV: ${{ vars.KMS_SECRET_ENV || 'prod' }}
        run: |
          set -euo pipefail
          KMS_TOKEN=$(curl -fsS "${KMS_ENDPOINT}/v1/kms/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"${KMS_CLIENT_ID}\",\"clientSecret\":\"${KMS_CLIENT_SECRET}\"}" \
            | jq -r '.accessToken // empty')
          [ -n "$KMS_TOKEN" ] || { echo "::error::KMS login failed at ${KMS_ENDPOINT}"; exit 1; }

          TOKEN=$(curl -fsS \
            "${KMS_ENDPOINT}/v1/kms/orgs/${KMS_ORG}/secrets/deploy/DO_API_TOKEN?env=${KMS_SECRET_ENV}" \
            -H "Authorization: Bearer ${KMS_TOKEN}" | jq -r '.secret.value // empty')
          [ -n "$TOKEN" ] || { echo "::error::DO_API_TOKEN missing in KMS at ${KMS_ORG}/deploy (env ${KMS_SECRET_ENV})"; exit 1; }

          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ steps.kms.outputs.token }}

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save hanzo-k8s

      - name: Apply manifests
        run: kubectl apply -f k8s/

      - name: Restart registry
        run: kubectl -n hanzo rollout restart deployment registry

      - name: Wait for rollout
        run: kubectl -n hanzo rollout status deployment registry --timeout=120s
