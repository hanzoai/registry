# Canonical CI/CD config for hanzoai/registry — read by the hanzoai/ci reusable
# (.hanzo/workflows/cicd.yml) and by platform.hanzo.ai.
#
# What this repo actually ships is k8s/, not an image. k8s/deployment.yaml runs
# UPSTREAM `registry:2` and configures the whole thing through env
# (REGISTRY_AUTH_TOKEN_REALM -> iam.hanzo.ai, storage, the CORS allowlist);
# nothing in this repo, in universe, or in the Makefile ever pulls
# ghcr.io/hanzoai/registry. So the Dockerfile beside those manifests builds an
# artifact with no consumer, and declaring `images:` here would publish a
# version series for it on every push — a tag a human could pin, standing for
# something we do not run. Left unbuilt on purpose.
#
# The failure this repo really has is a manifest that does not apply: `make
# deploy` and .hanzo/workflows/deploy.yml both end in `kubectl apply -f k8s/`,
# so a bad field there is found in production or not at all. kubeconform checks
# every manifest against the Kubernetes API schema offline — no cluster, no
# credentials — and -strict also rejects fields the schema does not define,
# which is how a silently-ignored typo gets caught. Proven red against a
# one-character break (replicas: "one" -> exit 1).
#
# No `deploy:` — the rollout is deploy.yml's, and there is no operator Service
# CR for this workload to name.

test:
  - name: manifests validate against the Kubernetes schema
    run: |
      set -euo pipefail
      export PATH="$HOME/.local/bin:$PATH"; mkdir -p "$HOME/.local/bin"
      command -v kubeconform >/dev/null 2>&1 || curl -fsSL \
        https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
        | tar -xz -C "$HOME/.local/bin" kubeconform
      kubeconform -strict -summary k8s/
