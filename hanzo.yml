# Canonical CI/CD config for hanzoai/registry — read by the hanzoai/ci reusable
# (.hanzo/workflows/cicd.yml) and by platform.hanzo.ai.
#
# No `images:`. oci.hanzo.ai runs UPSTREAM registry:2, configured entirely
# through REGISTRY_* env in hanzoai/universe. There is no image of ours here, so
# declaring one would publish a version series standing for something we do not
# run.
#
# No `deploy:`. The workload is declared in universe
# (charts/app/values/hanzo/registry.yaml) and applied by Hanzo CD. One writer.
#
# The repo is YAML, so "does it parse" is the whole check. `make lint` owns the
# file list — it reads git rather than a literal, so the gate fails on a parse
# error and not on a file that moved.

test:
  - name: every tracked YAML parses
    run: make lint
