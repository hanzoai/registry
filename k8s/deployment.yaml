apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: hanzo
  labels:
    app: registry
    app.kubernetes.io/name: registry
    app.kubernetes.io/part-of: hanzo-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: REGISTRY_AUTH
              value: token
            - name: REGISTRY_AUTH_TOKEN_REALM
              value: https://iam.hanzo.ai/api/registry/token
            - name: REGISTRY_AUTH_TOKEN_SERVICE
              value: registry.hanzo.ai
            - name: REGISTRY_AUTH_TOKEN_ISSUER
              value: hanzo-iam
            - name: REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE
              value: /etc/registry-signing/signing.crt
            # S3 backend credentials — injected from the hanzo-s3 secret, never
            # stored in the ConfigMap or image. Rest of the S3 config is in
            # config.yml (regionendpoint/bucket/forcepathstyle/...).
            - name: REGISTRY_STORAGE_S3_ACCESSKEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: REGISTRY_STORAGE_S3_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/docker/registry
              readOnly: true
            - name: signing-key
              mountPath: /etc/registry-signing
              readOnly: true
      volumes:
        # config.yml carries the S3 storage block; mounted over the image default.
        - name: config
          configMap:
            name: registry-config
            items:
              - key: config.yml
                path: config.yml
        - name: signing-key
          secret:
            secretName: registry-signing-key
            items:
              - key: SIGNING_CRT
                path: signing.crt
